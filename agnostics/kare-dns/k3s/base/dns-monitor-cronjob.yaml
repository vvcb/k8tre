# Updates CoreDNS if IPs don't match
apiVersion: v1
kind: ConfigMap
metadata:
  name: dns-monitor-script
  namespace: kube-system
data:
  monitor-dns.sh: |-
    #!/bin/sh
    set -e

    # Get upstream DNS from init container
    if [ -f /shared/upstream-dns ]; then
      UPSTREAM_DNS=$(cat /shared/upstream-dns)
      echo "Detected upstream DNS: $UPSTREAM_DNS"
    else
      echo "ERROR: Couldn't get upstream DNS"
      exit 1
    fi

    # Get current kare-dns ClusterIP
    CURRENT_IP=$(kubectl get svc kare-dns-coredns -n kare-dns -o jsonpath='{.spec.clusterIP}' 2>/dev/null || echo "")

    if [ -z "$CURRENT_IP" ]; then
      echo "ERROR: kare-dns service not found"
      exit 1
    fi

    # Get configured values from CoreDNS Corefile
    COREFILE=$(kubectl get cm coredns -n kube-system -o jsonpath='{.data.Corefile}')
    CONFIGURED_IP=$(echo "$COREFILE" | grep -A 2 "${DOMAIN}:53" | grep "forward" | awk '{print $3}' | cut -d: -f1)
    CONFIGURED_UPSTREAM=$(echo "$COREFILE" | grep -A 20 '^\.:53' | grep "forward" | awk '{print $3}' | head -1)

    echo "Current kare-dns IP: $CURRENT_IP (configured: $CONFIGURED_IP)"
    echo "Current upstream DNS: $UPSTREAM_DNS (configured: $CONFIGURED_UPSTREAM)"

    # Check for any mismatch (kare-dns IP or upstream DNS)
    if [ "$CURRENT_IP" = "$CONFIGURED_IP" ] && [ "$UPSTREAM_DNS" = "$CONFIGURED_UPSTREAM" ]; then
      echo "DNS configuration is correct, no action needed"
      exit 0
    fi

    echo "Configuration mismatch detected! Updating CoreDNS..."

    # Validate kare-dns responds on port 53 before patching
    echo "Validating kare-dns at $CURRENT_IP:53..."
    KARE_DNS_EXIT=0
    timeout 5 nslookup "test.${DOMAIN}" "$CURRENT_IP" >/dev/null 2>&1 || KARE_DNS_EXIT=$?
    if [ "$KARE_DNS_EXIT" -eq 124 ]; then
      echo "ERROR: kare-dns not responding on $CURRENT_IP:53, skipping update"
      exit 1
    fi
    echo "kare-dns validated: responding on port 53"

    # Validate upstream DNS before patching
    if [ "$UPSTREAM_DNS" != "/etc/resolv.conf" ]; then
      echo "Validating upstream DNS: $UPSTREAM_DNS..."
      UPSTREAM_EXIT=0
      timeout 5 nslookup "${DNS_TEST_DOMAIN:-github.com}" "$UPSTREAM_DNS" >/dev/null 2>&1 || UPSTREAM_EXIT=$?
      if [ "$UPSTREAM_EXIT" -ne 0 ]; then
        echo "ERROR: Upstream DNS $UPSTREAM_DNS can't resolve ${DNS_TEST_DOMAIN:-github.com}, skipping update"
        exit 1
      fi
      echo "Upstream DNS validated: can resolve ${DNS_TEST_DOMAIN:-github.com}"
    fi

    # Generate new Corefile
    cat > /tmp/new-corefile << 'COREFILE'
    ${DOMAIN}:53 {
        errors
        forward . ${CURRENT_IP}:53
    }
    .:53 {
        errors
        health
        ready
        kubernetes cluster.local in-addr.arpa ip6.arpa {
            pods insecure
            fallthrough in-addr.arpa ip6.arpa
        }
        hosts /etc/coredns/NodeHosts {
            ttl 60
            reload 15s
            fallthrough
        }
        prometheus :9153
        forward . ${UPSTREAM_DNS}
        cache 30
        loop
        reload
        loadbalance
        import /etc/coredns/custom/*.override
    }
    import /etc/coredns/custom/*.server
    COREFILE

    # Substitute env vars (using | delimiter for /etc/resolv.conf compatibility)
    sed -i "s|\${ENVIRONMENT}|$ENVIRONMENT|g; s|\${DOMAIN}|$DOMAIN|g; s|\${CURRENT_IP}|$CURRENT_IP|g; s|\${UPSTREAM_DNS}|$UPSTREAM_DNS|g" /tmp/new-corefile

    # Update and restart
    kubectl patch configmap coredns -n kube-system --patch "{\"data\":{\"Corefile\":\"$(cat /tmp/new-corefile | sed 's/$/\\n/' | tr -d '\n' | sed 's/\\n$//')\"}}"
    kubectl rollout restart deployment/coredns -n kube-system
    echo "CoreDNS updated successfully"

---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: dns-monitor
  namespace: kube-system
spec:
  schedule: "*/2 * * * *"  # every 2 mins
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 2
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        spec:
          serviceAccountName: coredns
          restartPolicy: OnFailure
          initContainers:
          - name: detect-upstream-dns
            image: alpine/k8s:1.31.1
            command:
            - /bin/sh
            - -c
            - |
              echo "Detecting upstream DNS server"
              DETECTED_DNS=""
              TEST_DOMAIN="${DNS_TEST_DOMAIN:-dns.google}"

              # systemd-resolved (authoritative upstream config)
              if [ -f /run/systemd/resolve/resolv.conf ]; then
                for NS in $(grep "^nameserver" /run/systemd/resolve/resolv.conf 2>/dev/null | awk '{print $2}'); do
                  if timeout 2 nslookup "$TEST_DOMAIN" "$NS" >/dev/null 2>&1; then
                    DETECTED_DNS="$NS"
                    echo "Using systemd-resolved: $NS"
                    break
                  fi
                done
              fi

              # /etc/resolv.conf (exclude loopback addresses)
              # Validate that at least one nameserver works, but write the file path
              # To make sure CoreDNS reads all nameservers dynamically.
              if [ -z "$DETECTED_DNS" ]; then
                for NS in $(grep "^nameserver" /etc/resolv.conf 2>/dev/null | awk '{print $2}' | grep -v '^127\.' | grep -v '^::1$'); do
                  if timeout 2 nslookup "$TEST_DOMAIN" "$NS" >/dev/null 2>&1; then
                    DETECTED_DNS="/etc/resolv.conf"
                    echo "Using resolv.conf: $NS validated, forwarding via /etc/resolv.conf"
                    break
                  fi
                done
              fi

              # Default gateway (for NAT/VM environments where gateway provides DNS)
              if [ -z "$DETECTED_DNS" ]; then
                GATEWAY_DNS=$(ip route | grep default | awk '{print $3}' | head -1)
                if [ -n "$GATEWAY_DNS" ]; then
                  if timeout 2 nslookup "$TEST_DOMAIN" "$GATEWAY_DNS" >/dev/null 2>&1; then
                    DETECTED_DNS="$GATEWAY_DNS"
                    echo "Using gateway: $GATEWAY_DNS"
                  fi
                fi
              fi

              # Write result
              if [ -n "$DETECTED_DNS" ]; then
                echo "$DETECTED_DNS" > /shared/upstream-dns
              else
                echo "WARNING: No validated DNS found, using /etc/resolv.conf as fallback"
                echo "/etc/resolv.conf" > /shared/upstream-dns
              fi
            volumeMounts:
            - name: shared-data
              mountPath: /shared
            securityContext:
              runAsNonRoot: true
              runAsUser: 65534
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: ["ALL"]
          containers:
          - name: monitor
            image: alpine/k8s:1.31.1
            command: ["/bin/sh", "/scripts/monitor-dns.sh"]
            env:
            - name: ENVIRONMENT
              value: "${ENVIRONMENT}"
            - name: DOMAIN
              value: "${DOMAIN}"
            volumeMounts:
            - name: scripts
              mountPath: /scripts
              readOnly: true
            - name: tmp
              mountPath: /tmp
            - name: shared-data
              mountPath: /shared
              readOnly: true
            resources:
              requests:
                memory: "16Mi"
                cpu: "5m"
              limits:
                memory: "32Mi"
                cpu: "20m"
            securityContext:
              runAsNonRoot: true
              runAsUser: 65534
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: ["ALL"]
          volumes:
          - name: scripts
            configMap:
              name: dns-monitor-script
              defaultMode: 0755
          - name: tmp
            emptyDir: {}
          - name: shared-data
            emptyDir: {}
          hostNetwork: true
          dnsPolicy: Default
